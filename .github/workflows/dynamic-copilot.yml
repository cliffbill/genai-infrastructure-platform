name: Dynamic Infrastructure Copilot

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]

jobs:
  dynamic-copilot:
    if: |
      contains(github.event.issue.labels.*.name, 'dynamic-infrastructure-request') &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies / GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh

      - name: Run Dynamic Copilot Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PLATFORM_TOKEN: ${{ secrets.GH_PLATFORM_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          LLM_BASE_URL: "https://api.openai.com/v1"
          LLM_MODEL: "gpt-5.4-nano"
        run: python src/dynamic_copilot.py
