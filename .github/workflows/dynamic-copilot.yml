name: Dynamic Infrastructure Copilot

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  dynamic-copilot:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'dynamic-infrastructure-request')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.type != 'Bot' && contains(github.event.issue.labels.*.name, 'dynamic-infrastructure-request'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies / GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh

      - name: Run Dynamic Copilot Engine
        env:
          GH_PLATFORM_TOKEN: ${{ secrets.GH_PAT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/dynamic_copilot.py
